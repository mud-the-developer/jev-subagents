name: Source checks

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          install --frozen-lockfile --ignore-scripts
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          audit --audit-level=moderate
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          run check:bun-only

  macos-full:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          install --frozen-lockfile --ignore-scripts
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          audit --audit-level=moderate
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          run check:bun-only

  # Hosted Windows runners are elevated; native profile creation rejects admin.
  # Non-admin NTFS/process acceptance remains a separate release gate.
  windows-types:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          install --frozen-lockfile --ignore-scripts
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          run lint
      - run: >-
          bun --no-env-file --no-install --config=src/worker-bunfig.toml
          run typecheck
